<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jogos — Lucas Emanuel</title>
    <meta name="description" content="Jogo da velha contra a máquina, com IA minimax em três níveis de dificuldade." />
    <meta name="author" content="Lucas Emanuel" />
    <meta name="theme-color" content="#08070b" />
    <link rel="canonical" href="https://lucasemanuel.com.br/jogos/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jogos — Lucas Emanuel" />
    <meta property="og:description" content="Jogo da velha contra a máquina, com IA minimax." />
    <meta property="og:url" content="https://lucasemanuel.com.br/jogos/" />
    <meta property="og:locale" content="pt_BR" />

    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar o tema errado
      (() => {
        let pref = null;
        try {
          pref = localStorage.getItem("theme");
        } catch {}
        const light = pref === "light" || (pref !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="../style.css?v=20260926.6" />
  </head>
  <body data-page="jogos" data-root="../">
    <header class="site-header">
      <a href="../" class="logo" aria-label="Início">le</a>
      <nav class="nav" aria-label="Principal">
        <a href="../" title="Atalho: I" aria-keyshortcuts="I">Início</a>
        <a href="../#skills" title="Atalho: S" aria-keyshortcuts="S">Skills</a>
        <a href="../#contato" title="Atalho: C" aria-keyshortcuts="C">Contato</a>
        <a href="../setup/" title="Atalho: U" aria-keyshortcuts="U">Setup</a>
      </nav>
      <div class="header-actions">
        <div class="theme-switch">
          <button class="theme-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" aria-label="Tema">
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <ul class="theme-menu" id="theme-menu" role="menu" aria-label="Tema" hidden>
            <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="light">Claro</button></li>
            <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="dark">Escuro</button></li>
            <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="system">Sistema</button></li>
          </ul>
        </div>
        <button class="cmd-trigger" type="button" data-open-palette aria-label="Abrir paleta de comandos">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M18 3a3 3 0 0 0-3 3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 0 0 0-6z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="container games">
      <h1 class="games-title">Jogo da velha</h1>
      <p class="games-lead">Você contra a máquina. No nível Impossível, o melhor que dá para fazer é empatar.</p>

      <form class="velha-opts" id="velha-opts">
        <fieldset>
          <legend>Você joga com</legend>
          <label><input type="radio" name="simbolo" value="X" checked /> X</label>
          <label><input type="radio" name="simbolo" value="O" /> O</label>
        </fieldset>
        <fieldset>
          <legend>Quem começa</legend>
          <label><input type="radio" name="inicio" value="voce" checked /> Você</label>
          <label><input type="radio" name="inicio" value="maquina" /> Máquina</label>
        </fieldset>
        <fieldset>
          <legend>Nível</legend>
          <label><input type="radio" name="nivel" value="facil" /> Fácil</label>
          <label><input type="radio" name="nivel" value="medio" checked /> Médio</label>
          <label><input type="radio" name="nivel" value="impossivel" /> Impossível</label>
        </fieldset>
      </form>

      <p class="velha-status" id="velha-status" role="status" aria-live="polite"></p>

      <div class="velha-board" id="velha-board" role="group" aria-label="Tabuleiro do jogo da velha (setas movem entre as casas)"></div>

      <div class="velha-actions">
        <button class="velha-btn" id="velha-new" type="button">Nova partida</button>
      </div>

      <section class="velha-score" aria-label="Placar">
        <dl>
          <div><dt>Vitórias</dt><dd id="score-vitorias">0</dd></div>
          <div><dt>Empates</dt><dd id="score-empates">0</dd></div>
          <div><dt>Derrotas</dt><dd id="score-derrotas">0</dd></div>
        </dl>
        <button class="velha-reset" id="velha-reset" type="button">zerar placar</button>
      </section>

      <p class="games-tip">Também dá para jogar no <a href="../terminal/">terminal</a>: digite <code>play velha</code>.</p>
    </main>

    <!-- Paleta de comandos (Ctrl/⌘ + K) -->
    <div class="palette" id="palette" hidden>
      <div class="palette-backdrop" data-close-palette></div>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="Paleta de comandos">
        <input
          class="palette-input"
          id="palette-input"
          type="text"
          placeholder="Digite um comando ou pesquise…"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="true"
          aria-controls="palette-list"
        />
        <ul class="palette-list" id="palette-list" role="listbox"></ul>
      </div>
    </div>

    <a class="term-fab" href="../terminal/" aria-label="Abrir o terminal" title="Terminal (T)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM7 10l3 2-3 2M12 15h5" />
      </svg>
    </a>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../script.js?v=20260926.6"></script>
    <script src="velha-ia.js?v=20260926.6"></script>
    <script src="jogos.js?v=20260926.6"></script>
  </body>
</html>
