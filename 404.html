<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Lucas Emanuel</title>
    <meta name="description" content="Página não encontrada." />
    <meta name="author" content="Lucas Emanuel" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08070b" />

    <!-- O GitHub Pages serve este arquivo em qualquer endereço inexistente (/a/b/c),
         então todos os caminhos aqui são absolutos -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar o tema errado
      (() => {
        let pref = null;
        try {
          pref = localStorage.getItem("theme");
        } catch {}
        const light = pref === "light" || (pref !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=20260926.3" />
  </head>
  <body data-page="404" data-root="/">
    <header class="site-header">
      <a href="/" class="logo" aria-label="Início">le</a>
      <nav class="nav" aria-label="Principal">
        <a href="/" title="Atalho: I" aria-keyshortcuts="I">Início</a>
        <a href="/#skills" title="Atalho: S" aria-keyshortcuts="S">Skills</a>
        <a href="/#contato" title="Atalho: C" aria-keyshortcuts="C">Contato</a>
        <a href="/setup/" title="Atalho: U" aria-keyshortcuts="U">Setup</a>
      </nav>
      <div class="header-actions">
        <div class="theme-switch">
          <button class="theme-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" aria-label="Tema">
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <ul class="theme-menu" id="theme-menu" role="menu" aria-label="Tema" hidden>
            <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="light">Claro</button></li>
            <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="dark">Escuro</button></li>
            <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="system">Sistema</button></li>
          </ul>
        </div>
        <button class="cmd-trigger" type="button" data-open-palette aria-label="Abrir paleta de comandos">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M18 3a3 3 0 0 0-3 3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 0 0 0-6z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="nf-code reveal" aria-hidden="true">404</p>
          <h1 class="reveal">Página não encontrada</h1>
          <pre class="nf-cmd reveal" aria-label="Erro no terminal"><code><span class="nf-prompt">lucas@lucasemanuel:~$</span> cd <span class="nf-path">/</span>
bash: cd: <span class="nf-path">/</span>: arquivo ou diretório inexistente</code></pre>
          <p class="stack reveal">O endereço não existe ou mudou de lugar.</p>
          <p class="nf-actions reveal">
            <a class="start" href="/">Voltar ao início <span aria-hidden="true">→</span></a>
            <a class="start" href="/terminal/">Abrir o terminal <span aria-hidden="true">→</span></a>
          </p>
        </div>
      </section>
    </main>

    <!-- Paleta de comandos (Ctrl/⌘ + K) -->
    <div class="palette" id="palette" hidden>
      <div class="palette-backdrop" data-close-palette></div>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="Paleta de comandos">
        <input
          class="palette-input"
          id="palette-input"
          type="text"
          placeholder="Digite um comando ou pesquise…"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="true"
          aria-controls="palette-list"
        />
        <ul class="palette-list" id="palette-list" role="listbox"></ul>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/script.js?v=20260926.3"></script>
    <script>
      // Mostra qual endereço não foi encontrado (textContent: nada do endereço vira HTML)
      (() => {
        const path = location.pathname + location.search;
        document.querySelectorAll(".nf-path").forEach((el) => (el.textContent = path));
        document.title = `404 — ${path} — Lucas Emanuel`;
      })();
    </script>
  </body>
</html>
